name: 24-7 Cloud Altcoin Auto-Trader (TradingArena AI v9.5)

on:
  # Yerel PC acikken bulut suresi (kota) harcanmamasi ve cakisma olmamasi icin zamanlayici kapali tutulur.
  # Bilgisayar kapatilacagi zaman aktif edilir.
  workflow_dispatch:

concurrency:
  group: altcoin-cloud-trader
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Autonomous AI Trading Cycles (Multi-Cycle Cloud Service)
        env:
          TZ: 'Europe/Istanbul'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIVE_TRADING: 'true'
        run: |
          for i in 1 2 3; do
            node altcoin_auto_trader.mjs
            if [ "$i" -lt 3 ]; then sleep 45; fi
          done

      - name: Commit and Sync Updated Portfolio State
        run: |
          git config user.name "AltcoinNewsHunter Cloud Bot"
          git config user.email "actions@github.com"
          git add portfolio_state.json RAPOR.md altcoin_news_signals.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(cloud-bot): auto-sync live portfolio state and TL report [skip ci]"
            git pull --rebase -X ours origin main || true
            git push origin main
          fi
